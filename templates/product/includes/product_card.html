
      <article class="stiletto-product-card" id="product-{{ product.sku }}">
        <div class="stiletto-product-media">
          <span class="stiletto-product-badge {% if product.stock <= 0 %}out-of-stock-badge{% endif %}">{% if product.stock <= 0 %}OUT OF STOCK{% else %}{{ product.badge|default:"NEW" }}{% endif %}</span>

          {% if product.stock > 0 %}
          <div class="card-quick-sizes" aria-label="Quick size select for {{ product.name }}">
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'XS', '{{ product.color|default:"Black"|escapejs }}')">XS</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'S', '{{ product.color|default:"Black"|escapejs }}')">S</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'M', '{{ product.color|default:"Black"|escapejs }}')">M</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'L', '{{ product.color|default:"Black"|escapejs }}')">L</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'XL', '{{ product.color|default:"Black"|escapejs }}')">XL</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', 'XXL', '{{ product.color|default:"Black"|escapejs }}')">XXL</button>
            <button type="button" class="card-size-pill" onclick="quickAddCardSize(event, '{{ product.name|escapejs }}', '{{ product.final_price }}', '{{ product.image_url }}', '{{ product.slug }}', '3XL', '{{ product.color|default:"Black"|escapejs }}')">3XL</button>
          </div>
          {% endif %}

          <button type="button" class="stiletto-product-wishlist" aria-label="Save {{ product.name }} to wishlist" 
                  id="wishlist-btn-{{ product.id }}"
                  data-product-id="{{ product.id }}"
                  data-name="{{ product.name|escape }}"
                  data-price="{{ product.final_price }}"
                  data-image="{{ product.image_url }}"
                  data-color="{{ product.color|default:'Cream'|escape }}"
                  data-slug="{{ product.slug }}"
                  data-gallery="[{% for g in product.gallery_urls %}&quot;{{ g }}&quot;{% if not forloop.last %},{% endif %}{% endfor %}]"
                  onclick="openAddToListModal(this, event)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>

          <a href="{% url 'product_detail_plural' product.slug %}" aria-label="{{ product.name }}" onclick="triggerProductDetailLoader('{% url 'product_detail_plural' product.slug %}', event)">
            <img src="{{ product.image_url }}" 
                 alt="{{ product.name }}" 
                 loading="lazy"
                 onerror="this.onerror=null; this.src='/static/images/products/womens-duck-egg-wisteria.png';">
          </a>
        </div>

        <div class="stiletto-product-info">
          <h4 class="stiletto-product-title">
            <a href="{% url 'product_detail_plural' product.slug %}" onclick="triggerProductDetailLoader('{% url 'product_detail_plural' product.slug %}', event)">{{ product.name }}</a>
          </h4>

          <div class="stiletto-product-bottom-row">
            <span class="stiletto-product-price">₹{{ product.final_price }}</span>

            <button type="button" class="btn-quick-bag" aria-label="Quick View {{ product.name }}"
                    data-name="{{ product.name|escape }}"
                    data-sku="{{ product.sku|default:'LDGVPKAU00XS' }}"
                    data-price="{{ product.final_price }}"
                    data-image="{{ product.image_url }}"
                    data-slug="{{ product.slug }}"
                    data-color="{{ product.color|default:'Black'|escape }}"
                    data-stock="{% if product.stock is not None %}{{ product.stock }}{% else %}0{% endif %}"
                    data-desc="{{ product.description|escape|default:'Wrap yourself in a little everyday luxury with our signature sleepwear. Made from beautifully soft fabric with playful finishing touches, perfect for slow mornings and lounging in style.' }}"
                    data-detail-url="{% url 'product_detail_plural' product.slug %}"
                    onclick="openQuickShopModal(this, event)">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
            </button>
          </div>
        </div>
      </article>
